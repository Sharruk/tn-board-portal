# ======================================================================
# render.yaml — Render deployment configuration
# https://render.com/docs/blueprint-spec
# ======================================================================
#
# Deploy via: Render Dashboard → New → Blueprint → point to this file
# Or push this file to your repo and Render will auto-detect it.
#
# Environment variable VALUES are never stored here.
# Set them in Render Dashboard → Environment after first deploy.
# ======================================================================

services:
  - type: web
    name: tn-board-portal-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile

    # ── Scaling ──────────────────────────────────────────────────────
    plan: free          # Change to starter/standard for production

    # ── Health check ─────────────────────────────────────────────────
    healthCheckPath: /health

    # ── Auto-deploy ──────────────────────────────────────────────────
    autoDeploy: true
    branch: main       # Production branch

    # ── Environment variables ────────────────────────────────────────
    # Set ACTUAL values in Render Dashboard → Environment.
    # Only variable NAMES are listed here — never values.
    envVars:
      - key: ENVIRONMENT
        value: production

      - key: LOG_LEVEL
        value: INFO

      - key: DEBUG
        value: "false"

      - key: SUPABASE_URL
        sync: false       # Must be set manually in Render Dashboard

      - key: SUPABASE_ANON_KEY
        sync: false       # Must be set manually in Render Dashboard

      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false       # Must be set manually in Render Dashboard

      - key: CORS_ORIGINS
        sync: false       # Set to your Vercel frontend URL in Render Dashboard

      - key: BACKEND_URL
        sync: false       # Set to your Render service URL after first deploy

      # ── Firebase Admin SDK ───────────────────────────────────────────────
      # Paste the ENTIRE content of firebase-service-account.json here.
      # This is the preferred method for Docker deployments where the file
      # cannot be included in the image.
      # NEVER commit the actual value to version control.
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false       # Must be set manually in Render Dashboard

      # FIREBASE_SERVICE_ACCOUNT_PATH is only needed for local dev.
      # Leave unset on Render (use FIREBASE_SERVICE_ACCOUNT_JSON instead).
