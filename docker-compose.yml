# ======================================================================
# TN Board Portal — Full-Application Local Docker Environment
# ======================================================================
# Usage:
#   docker compose up --build
#
# Endpoints:
#   Frontend: http://localhost:5000
#   Backend:  http://localhost:8000
#   Health:   http://localhost:8000/health
# ======================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: tn-board-backend:latest
    container_name: tn-board-backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./.env
        required: false
      - path: ./backend/.env
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: tn-board-frontend:latest
    container_name: tn-board-frontend
    ports:
      - "5000:5000"
    environment:
      - VITE_API_PROXY_TARGET=http://backend:8000
    env_file:
      - path: ./.env
        required: false
      - path: ./frontend/.env.local
        required: false
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
