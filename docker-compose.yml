services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tnboard
      POSTGRES_USER: tnboard
      POSTGRES_PASSWORD: tnboard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tnboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://tnboard:tnboard@db:5432/tnboard
      ENVIRONMENT: development
      CORS_ORIGINS: "*"
      STORAGE_BACKEND: local
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-in-production}
    volumes:
      - ./uploads:/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5000:5000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    depends_on:
      - backend

volumes:
  pgdata:
