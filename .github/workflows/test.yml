name: Unit Tests

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# This workflow becomes active once Vitest is set up (GitHub Issue #37).
# Until then the job will be skipped via the condition below.

jobs:
  test:
    name: Vitest
    runs-on: ubuntu-latest
    # Remove this condition once package.json contains a "test" script (issue #37)
    if: ${{ contains(toJSON(github.event.head_commit.message), '[enable-tests]') || github.ref == 'refs/heads/develop' }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --reporter=verbose

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: frontend/coverage/
          retention-days: 7
